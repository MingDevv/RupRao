services:
  ruprao:
    build: .
    container_name: ruprao-app
    ports:
      - "8000:8000"
    volumes:
      # รูป + ฐานข้อมูล + FAISS index อยู่นอก container → รีสตาร์ท/อัปเดตแล้วข้อมูลไม่หาย
      - ./data:/app/data
    # ค่าตั้งทั้งหมด (Firebase, อีเมลแอดมิน, PIN) อ่านจากไฟล์ .env ข้างๆ — ไม่ถูกฝังใน image
    env_file:
      - .env
    restart: unless-stopped
